name: Hardware contracts and native builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      esp_idf: ${{ steps.plan.outputs.esp_idf }}
      esp_idf_count: ${{ steps.plan.outputs.esp_idf_count }}
      linux: ${{ steps.plan.outputs.linux }}
      linux_count: ${{ steps.plan.outputs.linux_count }}
      arduino: ${{ steps.plan.outputs.arduino }}
      arduino_count: ${{ steps.plan.outputs.arduino_count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential device-tree-compiler python3-venv curl
      - name: Install isolated cloud client test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/codecraft-host-env"
          "$RUNNER_TEMP/codecraft-host-env/bin/python" -m pip install -r tests/requirements.txt
          "$RUNNER_TEMP/codecraft-host-env/bin/python" -m pip check
          echo "$RUNNER_TEMP/codecraft-host-env/bin" >> "$GITHUB_PATH"
      - name: Discover centralized host tests
        run: python3 codecraft.py test --list > "$RUNNER_TEMP/codecraft-host-tests.json"
      - run: python3 codecraft.py validate --static
      - id: plan
        name: Select affected native Targets
        run: |
          python3 codecraft.py ci plan --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" \
            --report "$RUNNER_TEMP/codecraft-ci-plan.json"

  esp-idf:
    needs: contracts
    if: needs.contracts.outputs.esp_idf_count != '' && needs.contracts.outputs.esp_idf_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contracts.outputs.esp_idf) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v${{ matrix.toolchain }}
          target: ${{ matrix.chip }}
          command: python3 codecraft.py validate --target ${{ matrix.id }} --projects

  linux:
    needs: contracts
    if: needs.contracts.outputs.linux_count != '' && needs.contracts.outputs.linux_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contracts.outputs.linux) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - run: python3 codecraft.py validate --target "$TARGET" --projects
        env:
          TARGET: ${{ matrix.id }}

  arduino:
    needs: contracts
    if: needs.contracts.outputs.arduino_count != '' && needs.contracts.outputs.arduino_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contracts.outputs.arduino) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db # v2.1.0
        with:
          version: ${{ matrix.toolchain }}
      - name: Install declared core and libraries
        env:
          TARGET: ${{ matrix.id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          stack, device = os.environ['TARGET'].split('/')
          toolchain = json.loads(Path(f'devices/{device}/targets/target.json').read_text())['toolchain']
          urls = toolchain['board_manager_urls']
          extra = ['--additional-urls', ','.join(urls)] if urls else []
          subprocess.run(['arduino-cli', 'core', 'update-index', *extra], check=True)
          core = ':'.join(toolchain['fqbn'].split(':')[:2])
          subprocess.run(['arduino-cli', 'core', 'install', core + '@' + toolchain['core_version'], *extra], check=True)
          for name, version in toolchain.get('libraries', {}).items():
              subprocess.run(['arduino-cli', 'lib', 'install', '--no-deps', name + '@' + version], check=True)
          PY
      - run: python3 codecraft.py validate --target "$TARGET" --projects
        env:
          TARGET: ${{ matrix.id }}

  ci:
    name: CI result
    if: always()
    needs: [contracts, esp-idf, linux, arduino]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require every selected job to pass
        env:
          CODECRAFT_CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 codecraft.py ci check --needs-env CODECRAFT_CI_NEEDS --summary "$GITHUB_STEP_SUMMARY"
