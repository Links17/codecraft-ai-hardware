name: Hardware contracts and native builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    outputs:
      esp_idf: ${{ steps.matrix.outputs.esp_idf }}
      linux: ${{ steps.matrix.outputs.linux }}
      arduino: ${{ steps.matrix.outputs.arduino }}
      arduino_count: ${{ steps.matrix.outputs.arduino_count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Discover owner-local host tests
        run: python3 codecraft.py test --list > "$RUNNER_TEMP/codecraft-host-tests.json"
      - run: python3 codecraft.py validate --static
      - id: matrix
        name: Read generated Target matrix
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          entries = json.loads(Path('.github/target-matrix.json').read_text())['include']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, platform in [('esp_idf', 'esp-idf'), ('linux', 'linux'), ('arduino', 'arduino')]:
                  selected = [row for row in entries if row['platform'] == platform]
                  print(key + '=' + json.dumps({'include': selected}), file=output)
                  print(key + '_count=' + str(len(selected)), file=output)
          PY

  esp-idf:
    needs: contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contracts.outputs.esp_idf) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v${{ matrix.toolchain }}
          target: ${{ matrix.chip }}
          command: python3 codecraft.py validate --target ${{ matrix.id }} --projects

  linux:
    needs: contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contracts.outputs.linux) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - run: python3 codecraft.py validate --target "$TARGET" --projects
        env:
          TARGET: ${{ matrix.id }}

  arduino:
    needs: contracts
    if: needs.contracts.outputs.arduino_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contracts.outputs.arduino) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db # v2.1.0
        with:
          version: ${{ matrix.toolchain }}
      - name: Install declared core and libraries
        env:
          TARGET: ${{ matrix.id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          stack, device = os.environ['TARGET'].split('/')
          toolchain = json.loads(Path(f'platforms/{stack}/targets/{device}/target.json').read_text())['toolchain']
          urls = toolchain.get('additional_urls', [])
          extra = ['--additional-urls', ','.join(urls)] if urls else []
          subprocess.run(['arduino-cli', 'core', 'update-index', *extra], check=True)
          core = ':'.join(toolchain['fqbn'].split(':')[:2])
          subprocess.run(['arduino-cli', 'core', 'install', core + '@' + toolchain['core_version'], *extra], check=True)
          for name, version in toolchain.get('libraries', {}).items():
              subprocess.run(['arduino-cli', 'lib', 'install', name + '@' + version], check=True)
          PY
      - run: python3 codecraft.py validate --target "$TARGET" --projects
        env:
          TARGET: ${{ matrix.id }}
